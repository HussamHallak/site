<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Browser Size Display</title>
</head>
<body>
  <canvas id="imageCanvas" width="500" height="500"></canvas>

  <script>
    // ============================================================
    // Generate image with browser dimensions
    // ============================================================
    function generateImage() {
      const canvas = document.getElementById('imageCanvas');
      const ctx = canvas.getContext('2d');
      
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      // Fixed canvas size 500x500
      canvas.width = 500;
      canvas.height = 500;
      
      // Background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 500, 500);
      
      // Border
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.strokeRect(5, 5, 490, 490);
      
      // Text styling
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      
      // Main message
      const mainText = `Browser Size`;
      ctx.font = 'bold 32px Arial, sans-serif';
      ctx.fillText(mainText, 250, 160);
      
      // Display dimensions prominently
      ctx.font = 'bold 48px Arial, sans-serif';
      ctx.fillText(`${width} × ${height}`, 250, 240);
      
      // Subtext
      ctx.font = '16px Arial, sans-serif';
      ctx.fillStyle = '#666666';
      ctx.fillText('pixels', 250, 290);
      
      // Full timestamp with year, month, day, hour, minutes, seconds
      ctx.font = '12px Arial, sans-serif';
      ctx.fillStyle = '#999999';
      const now = new Date();
      const timestamp = now.getFullYear() + '-' + 
                       String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                       String(now.getDate()).padStart(2, '0') + ' ' + 
                       String(now.getHours()).padStart(2, '0') + ':' + 
                       String(now.getMinutes()).padStart(2, '0') + ':' + 
                       String(now.getSeconds()).padStart(2, '0');
      ctx.fillText(`Updated: ${timestamp}`, 250, 465);
    }

    // ============================================================
    // Run on load and resize
    // ============================================================
    generateImage();
    window.addEventListener('resize', generateImage);
  </script>
</body>
</html>
