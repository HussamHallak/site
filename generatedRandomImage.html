<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Browser Size Display</title>
</head>
<body>
  <canvas id="imageCanvas"></canvas>

  <script>
    // ============================================================
    // Generate image on canvas with browser dimensions
    // ============================================================
    function generateImage() {
      const canvas = document.getElementById('imageCanvas');
      const ctx = canvas.getContext('2d');
      
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      // Set canvas size to match browser window
      canvas.width = width;
      canvas.height = height;
      
      // Background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
      
      // Text styling
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      
      // Main message
      const mainText = `I am an image displayed in a browser that is ${width} in width and ${height} in height.`;
      
      // Adjust font size based on window dimensions
      let fontSize = Math.min(width, height) / 20;
      fontSize = Math.max(12, Math.min(fontSize, 48));
      ctx.font = `${fontSize}px Arial, sans-serif`;
      
      // Wrap text if needed
      const maxWidth = width * 0.9;
      const words = mainText.split(' ');
      let lines = [];
      let currentLine = '';
      
      for (let i = 0; i < words.length; i++) {
        const testLine = currentLine + words[i] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && currentLine.length > 0) {
          lines.push(currentLine.trim());
          currentLine = words[i] + ' ';
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine.length > 0) {
        lines.push(currentLine.trim());
      }
      
      // Draw each line
      const lineHeight = fontSize * 1.4;
      const totalHeight = lines.length * lineHeight;
      let y = (height - totalHeight) / 2 + fontSize / 2;
      
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], width / 2, y);
        y += lineHeight;
      }
      
      // Add smaller secondary text with just the dimensions
      ctx.font = `${fontSize * 0.6}px Arial, sans-serif`;
      ctx.fillStyle = '#666666';
      const subText = `Width: ${width}px  |  Height: ${height}px`;
      ctx.fillText(subText, width / 2, height - fontSize * 2);
    }

    // ============================================================
    // Run on load and resize
    // ============================================================
    generateImage();
    window.addEventListener('resize', generateImage);
  </script>
</body>
</html>
