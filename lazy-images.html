<!DOCTYPE html>
<html>
<head>
    <title>Lazy Images</title>
</head>
<body>
    <h1>Lazy Images</h1>
  <!-- Uses data-src and srcset – these attributes may be rewritten and included. -->
    <img src="https://via.placeholder.com/100" data-src="https://via.placeholder.com/300" alt="lazy">
    <img srcset="https://via.placeholder.com/200 1x, https://via.placeholder.com/400 2x" src="https://via.placeholder.com/200" alt="srcset">
</body>
</html>
