<!DOCTYPE html>
<html>
<head>
    <title>Lazy Images</title>
</head>
<body>
    <h1>Lazy Images</h1>
  <!-- Uses data-src and srcset – these attributes may be rewritten and included. -->
    <img src="./1.jpg" data-src="./2.jpg" alt="lazy">
    <img srcset="./3.jpg 1x, ./4.jpg 2x" src="./3.jpg" alt="srcset">
</body>
</html>
