<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Browser Size Display</title>
</head>
<body>
  <img id="sizeImage" alt="Browser size display">

  <script>
    const width = window.innerWidth;
    const height = window.innerHeight;

    // Update URL with query parameters if they're missing or different
    const params = new URLSearchParams(window.location.search);
    if (params.get('width') !== String(width) || params.get('height') !== String(height)) {
      params.set('width', width);
      params.set('height', height);
      history.replaceState(null, '', '?' + params.toString());
    }    
    // ============================================================
    // Generate image and display automatically when page loads
    // ============================================================
    function generateImage() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      // Create canvas
      const canvas = document.createElement('canvas');
      canvas.width = 500;
      canvas.height = 500;
      const ctx = canvas.getContext('2d');
      
      // Background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 500, 500);
      
      // Border
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.strokeRect(5, 5, 490, 490);
      
      // Text styling
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      
      // Main message
      ctx.font = 'bold 32px Arial, sans-serif';
      ctx.fillText('Browser Size', 250, 160);
      
      // Display dimensions prominently
      ctx.font = 'bold 48px Arial, sans-serif';
      ctx.fillText(`${width} × ${height}`, 250, 240);
      
      // Subtext
      ctx.font = '16px Arial, sans-serif';
      ctx.fillStyle = '#666666';
      ctx.fillText('pixels', 250, 290);
      
      // Full timestamp
      ctx.font = '12px Arial, sans-serif';
      ctx.fillStyle = '#999999';
      const now = new Date();
      const timestamp = now.getFullYear() + '-' + 
                       String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                       String(now.getDate()).padStart(2, '0') + ' ' + 
                       String(now.getHours()).padStart(2, '0') + ':' + 
                       String(now.getMinutes()).padStart(2, '0') + ':' + 
                       String(now.getSeconds()).padStart(2, '0');
      ctx.fillText(`Updated: ${timestamp}`, 250, 465);
      
      // Convert canvas to data URL and display in img tag
      const img = document.getElementById('sizeImage');
      img.src = canvas.toDataURL('image/png');
    }

    // ============================================================
    // Run automatically when page loads and on resize
    // ============================================================
    generateImage();
    window.addEventListener('resize', generateImage);
  </script>
</body>
</html>
