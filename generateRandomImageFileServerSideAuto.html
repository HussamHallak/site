<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Browser Size Display</title>
</head>
<body>
  <div id="loading">Generating image...</div>
  <div id="error" style="color:red;display:none;"></div>
  <img id="sizeImage" alt="Browser size display" style="display:none;">

  <script>
    // ============================================================
    // Automatically generate and save image when page loads
    // ============================================================
    function generateAndSaveImage() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      const loading = document.getElementById('loading');
      const errorDiv = document.getElementById('error');
      const img = document.getElementById('sizeImage');
      
      // Create canvas
      const canvas = document.createElement('canvas');
      canvas.width = 500;
      canvas.height = 500;
      const ctx = canvas.getContext('2d');
      
      // Draw the image
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 500, 500);
      
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.strokeRect(5, 5, 490, 490);
      
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      
      ctx.font = 'bold 32px Arial, sans-serif';
      ctx.fillText('Browser Size', 250, 160);
      
      ctx.font = 'bold 48px Arial, sans-serif';
      ctx.fillText(`${width} × ${height}`, 250, 240);
      
      ctx.font = '16px Arial, sans-serif';
      ctx.fillStyle = '#666666';
      ctx.fillText('pixels', 250, 290);
      
      ctx.font = '12px Arial, sans-serif';
      ctx.fillStyle = '#999999';
      const now = new Date();
      const timestamp = now.getFullYear() + '-' + 
                       String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                       String(now.getDate()).padStart(2, '0') + ' ' + 
                       String(now.getHours()).padStart(2, '0') + ':' + 
                       String(now.getMinutes()).padStart(2, '0') + ':' + 
                       String(now.getSeconds()).padStart(2, '0');
      ctx.fillText(`Generated: ${timestamp}`, 250, 465);
      
      // Convert to base64
      const dataUrl = canvas.toDataURL('image/png');
      const base64Data = dataUrl.split(',')[1];
      
      // Send to server to save as actual file
      loading.textContent = 'Saving image to server...';
      
      fetch('/.netlify/functions/generate-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image: base64Data,
          width: width,
          height: height,
          timestamp: timestamp
        })
      })
      .then(response => {
        if (!response.ok) {
          return response.json().then(data => {
            throw new Error(data.error || `HTTP ${response.status}: ${response.statusText}`);
          });
        }
        return response.json();
      })
      .then(data => {
        if (data.success) {
          // Display the saved image file
          img.src = data.url;
          img.style.display = 'block';
          loading.textContent = '✅ Image generated and saved!';
          loading.style.color = 'green';
          errorDiv.style.display = 'none';
        } else {
          throw new Error(data.error || 'Unknown error');
        }
      })
      .catch(error => {
        console.error('Error:', error);
        errorDiv.textContent = '❌ ' + error.message;
        errorDiv.style.display = 'block';
        loading.textContent = '❌ Failed to save image';
        loading.style.color = 'red';
      });
    }

    // Run automatically when page loads
    window.addEventListener('load', generateAndSaveImage);
  </script>
</body>
</html>
