<!DOCTYPE html>
<html>
<head>
    <title>Simple JS</title>
</head>
<body>
    <h1>Simple JS (adds image on load)</h1>
  <!-- Adds an <img> on DOMContentLoaded. -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var img = document.createElement('img');
            img.src = './1.jpg';
            document.body.appendChild(img);
        });
    </script>
    <img src="./2.jpg" alt="static">
</body>
</html>
